name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (downloads yt-dlp macOS binary)
        run: npm ci

      - name: Build renderer
        run: npx vite build

      - name: Package macOS app (arm64 + x64)
        run: npx electron-builder --mac dir --arm64 --x64 --config.mac.target=dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Zip the .app bundles
        run: |
          ditto -c -k --keepParent "out/mac-arm64/Lory's Music.app" "Lorys-Music-macOS-arm64.zip"
          ditto -c -k --keepParent "out/mac/Lory's Music.app" "Lorys-Music-macOS-x64.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Lorys-Music-macOS
          path: |
            Lorys-Music-macOS-arm64.zip
            Lorys-Music-macOS-x64.zip
          if-no-files-found: error